# ============================================================================
# mc-network 打包流水线（正式版）
# 仅在推送 v* 标签时打包并自动发布 Release；普通分支 push / PR 不触发。
# 逐行注释与备选参数说明见同目录 build-annotated.yaml（仅供阅读，不会执行）。
# ============================================================================
name: Build

on:
  push:
    tags: ['v*']                # 只有推送 v* 标签（如 v0.2.0）才打包；分支 push 不触发
  workflow_dispatch:            # 保留手动入口（Actions 页 Run workflow；填 version 出 draft Release）
    inputs:
      version:
        description: 'Release 版本号（如 0.2.0）；留空仅构建。发版推荐直接打 v* tag，自动发布 Release'
        required: false
        type: string

permissions:
  contents: write               # gh release create/upload 需要的写仓库内容权限

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: full
  # 与 src-tauri/build_support/easytier_pack.rs 的 ET_VERSION 保持一致（EasyTier 缓存 key）
  EASYTIER_VERSION: v2.6.4

defaults:
  run:
    shell: bash

jobs:
  build-windows:
    runs-on: windows-latest
    name: Build (x86_64-pc-windows-msvc)
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute Version
        run: |
          set -euo pipefail
          INPUT="${{ github.event.inputs.version }}"
          SOURCE=""
          if [ -n "$INPUT" ]; then
            VERSION="$INPUT"
            SOURCE=override
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            # tag 构建（如 v0.2.0）：版本号取自 tag
            VERSION="${GITHUB_REF_NAME#v}"
            SOURCE=override
          else
            VERSION="$(jq -r '.version' src-tauri/tauri.conf.json)"
            if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
              VERSION="${GITHUB_SHA::7}"
            fi
          fi
          if [ "$SOURCE" = "override" ]; then
            # 覆盖三处版本，保证安装包文件名与 Release 版本一致
            jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
            jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
            sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          fi
          echo "MCN_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "resolved version: $VERSION"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install Frontend Dependencies
        run: yarn install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      # build.rs 会从 GitHub Releases 下载 EasyTier 官方 zip；缓存命中则幂等跳过下载
      - name: Cache EasyTier Binaries
        uses: actions/cache@v4
        with:
          path: src-tauri/.easytier
          key: easytier-${{ env.EASYTIER_VERSION }}-windows-x86_64

      - name: Test
        working-directory: src-tauri
        run: cargo test --lib

      - name: Build
        run: yarn tauri build

      - name: Prepare Artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          cp "$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -n 1)" \
             "out/mc-network-${MCN_VERSION}-windows-x86_64-setup.exe"
          cp "$(ls src-tauri/target/release/bundle/msi/*.msi | head -n 1)" \
             "out/mc-network-${MCN_VERSION}-windows-x86_64.msi"
          cp src-tauri/target/release/mc-network.exe \
             "out/mc-network-${MCN_VERSION}-windows-x86_64.exe"
          ls -l out

      - name: Upload NSIS Installer
        uses: actions/upload-artifact@v7
        with:
          name: mc-network-${{ env.MCN_VERSION }}-windows-x86_64-setup.exe
          path: out/mc-network-${{ env.MCN_VERSION }}-windows-x86_64-setup.exe
          retention-days: 90
          archive: false

      - name: Upload MSI Installer
        uses: actions/upload-artifact@v7
        with:
          name: mc-network-${{ env.MCN_VERSION }}-windows-x86_64.msi
          path: out/mc-network-${{ env.MCN_VERSION }}-windows-x86_64.msi
          retention-days: 90
          archive: false

      - name: Upload Portable Executable
        uses: actions/upload-artifact@v7
        with:
          name: mc-network-${{ env.MCN_VERSION }}-windows-x86_64.exe
          path: out/mc-network-${{ env.MCN_VERSION }}-windows-x86_64.exe
          retention-days: 90
          archive: false

  assemble:
    runs-on: ubuntu-latest
    name: Assemble Artifact
    needs: build-windows
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute Version
        run: |
          set -euo pipefail
          INPUT="${{ github.event.inputs.version }}"
          if [ -n "$INPUT" ]; then
            VERSION="$INPUT"
          elif [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(jq -r '.version' src-tauri/tauri.conf.json)"
            if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
              VERSION="${GITHUB_SHA::7}"
            fi
          fi
          echo "MCN_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "resolved version: $VERSION"

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Pack All-in-One Archive
        run: |
          set -euo pipefail
          7z -m0=LZMA2 -mx=9 -ms=on a "mc-network-${MCN_VERSION}-all.7z" artifacts/*
          ls -l

      - name: Upload All-in-One Archive
        uses: actions/upload-artifact@v7
        with:
          name: mc-network-${{ env.MCN_VERSION }}-all.7z
          path: mc-network-${{ env.MCN_VERSION }}-all.7z
          retention-days: 90
          archive: false

      # tag 构建（v*）：直接发布 Release（全自动）；手动传 version：出 draft 供人工审核。
      # 若该 tag 的 Release 已在 GitHub 上建好，只把产物补挂上去（--clobber 覆盖同名资产）。
      - name: Create or Update Release
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '') }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
            DRAFT=""
          else
            TAG="v${MCN_VERSION}"
            DRAFT="1"
          fi
          FILES=(artifacts/* "mc-network-${MCN_VERSION}-all.7z")
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" --clobber "${FILES[@]}"
          elif [ -n "$DRAFT" ]; then
            gh release create "$TAG" --draft --generate-notes "${FILES[@]}"
          else
            gh release create "$TAG" --generate-notes "${FILES[@]}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
